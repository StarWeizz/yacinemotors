worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  # Rate limiting (see ADR-0011 and ADR-0012):
  # - general / api: generous, the Payload admin UI makes many API calls per page
  # - forms: strict, public endpoints that trigger Telegram messages (anti-spam)
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=forms:10m rate=6r/m;
  # Admin sign-in and password endpoints: slows password guessing on top of Payload's own lockout.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  # Docker's embedded DNS: re-resolve `app` so a recreated container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    # Nothing here uploads files: the admin only sends small JSON bodies.
    client_max_body_size 1m;
    set $upstream http://app:3000;

    include /etc/nginx/security_headers;

    # Next.js already sends the immutable Cache-Control header for these files.
    location /_next/static/ {
      include /etc/nginx/security_headers;
      include /etc/nginx/proxy_params;
      proxy_pass $upstream;
    }

    # Admin sign-in and account endpoints: strict limit
    location ~ ^/api/users/(login|forgot-password|reset-password|first-register|unlock)(/|$) {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/security_headers;
      include /etc/nginx/proxy_params;
      proxy_pass $upstream;
    }

    # Public form endpoints (contact, booking request): strict limit and small bodies
    location ~ ^/api/(contact|reservation)(/|$) {
      limit_req zone=forms burst=3 nodelay;
      client_max_body_size 32k;
      include /etc/nginx/security_headers;
      include /etc/nginx/proxy_params;
      proxy_pass $upstream;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      include /etc/nginx/security_headers;
      include /etc/nginx/proxy_params;
      proxy_pass $upstream;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/security_headers;
      include /etc/nginx/proxy_params;
      proxy_pass $upstream;
    }
  }
}
