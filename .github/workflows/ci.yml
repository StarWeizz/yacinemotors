name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Placeholders: the build only needs the Payload config to load, no real database.
      PAYLOAD_SECRET: ci-placeholder-secret
      DATABASE_URI: postgres://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Fails on a critical advisory in a production dependency (the known high/moderate ones are
      # documented in the README, "Limites").
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build

  migrations:
    name: Migrations apply on an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PAYLOAD_SECRET: ci-placeholder-secret
      DATABASE_URI: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run migrate:status
      - name: Seed is idempotent
        run: |
          npm run seed
          npm run seed

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: true
      PAYLOAD_SECRET: ci-placeholder-secret
      DATABASE_URI: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      - run: npm run seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
